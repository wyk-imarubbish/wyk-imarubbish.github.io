<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>井字棋游戏</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f5f5f5;
        }
        
        .container {
            text-align: center;
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 90vmin;
            height: 90vmin;
            max-width: 500px;
            max-height: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            background-color: #ffffff;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        
        .cell:hover {
            background-color: #f0f0f0;
            transform: scale(1.02);
        }
        
        .cell.x {
            color: #e74c3c;
        }
        
        .cell.o {
            color: #3498db;
        }
        
        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 1.4em;
            color: #333;
            font-weight: bold;
        }
        
        #controls {
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 1.1em;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #27ae60;
        }

        .winning-cell {
            background-color: #e8f5e9;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="gameBoard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div id="message"></div>
        <div id="controls">
            <button onclick="resetGame()">重新开始</button>
        </div>
    </div>
    <script>
        const cells = document.querySelectorAll('.cell');
        const message = document.getElementById('message');
        let currentPlayer = 'X';
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function handleCellClick(event) {
            const clickedCell = event.target;
            const clickedIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (board[clickedIndex] !== '' || !gameActive) {
                return;
            }

            board[clickedIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase());

            const winningCombo = checkWin();
            if (winningCombo) {
                highlightWinningCells(winningCombo);
                message.textContent = `🎉 玩家 ${currentPlayer} 获胜！`;
                gameActive = false;
                return;
            }

            if (board.every(cell => cell !== '')) {
                message.textContent = '🤝 平局！';
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            message.textContent = `轮到玩家 ${currentPlayer}`;
        }

        function checkWin() {
            for (const condition of winningConditions) {
                if (condition.every(index => board[index] === currentPlayer)) {
                    return condition;
                }
            }
            return null;
        }

        function highlightWinningCells(winningCombo) {
            winningCombo.forEach(index => {
                cells[index].classList.add('winning-cell');
            });
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            message.textContent = `轮到玩家 ${currentPlayer}`;
            
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o', 'winning-cell');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        message.textContent = `轮到玩家 ${currentPlayer}`;
    </script>
</body>
</html>
